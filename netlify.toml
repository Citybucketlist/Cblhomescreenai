[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Prerender the blog for crawlers/AI engines: inject real HTML + SEO metadata
# into the SPA shell for /blog and /blog/:slug. Static assets under /blog/*/*
# (images) have multiple path segments, so they don't match /blog/:slug.
[[edge_functions]]
  path = "/blog"
  function = "prerender"

[[edge_functions]]
  path = "/blog/:slug"
  function = "prerender"

[[edge_functions]]
  path = "/attractions"
  function = "prerender"

[[edge_functions]]
  path = "/directory"
  function = "prerender"

# Dynamic sitemap listing static pages + all published blog posts.
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same policy the live site already sends, plus the hosts GA4 needs.
# gtag.js loads from googletagmanager.com and sends hits to google-analytics.com.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), microphone=(self), camera=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://use.typekit.net https://p.typekit.net https://fonts.googleapis.com; font-src 'self' data: https://use.typekit.net https://p.typekit.net https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://use.typekit.net https://p.typekit.net https://ipwho.is https://ipapi.co https://api.bigdatacloud.net https://api.open-meteo.com https://*.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://www.google.com https://maps.google.com; upgrade-insecure-requests"
